function setStickyTop(){const hero=document.querySelector('.hero');if(hero)document.documentElement.style.setProperty('--sticky-top',Math.ceil(hero.getBoundingClientRect().height)+'px')}setStickyTop();addEventListener('resize',setStickyTop,{passive:true});const search=document.getElementById('search');const clear=document.getElementById('clear');const cards=[...document.querySelectorAll('.qa-card')];const sections=[...document.querySelectorAll('.category-section')];const buttons=[...document.querySelectorAll('.cat')];let activeCategory='all';let filterTimer=0;function applyFilter(){const q=search?search.value.trim().toLowerCase():'';for(const card of cards){const catOk=activeCategory==='all'||card.dataset.category===activeCategory;const textOk=!q||card.dataset.text.toLowerCase().includes(q);card.classList.toggle('hidden',!(catOk&&textOk))}for(const section of sections){const any=[...section.querySelectorAll('.qa-card')].some(card=>!card.classList.contains('hidden'));section.classList.toggle('hidden',!any)}}buttons.forEach(btn=>btn.addEventListener('click',()=>{activeCategory=btn.dataset.category;buttons.forEach(b=>b.classList.toggle('active',b===btn));applyFilter();setStickyTop()}));if(search)search.addEventListener('input',()=>{clearTimeout(filterTimer);filterTimer=setTimeout(applyFilter,120)});if(clear)clear.addEventListener('click',()=>{if(search)search.value='';activeCategory='all';buttons.forEach((b,i)=>b.classList.toggle('active',i===0));applyFilter();setStickyTop()});
