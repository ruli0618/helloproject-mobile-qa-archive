<style>
:root{--ink:#162033;--sub:#637083;--line:#dbe3ee;--soft:#f4f7fb;--panel:#fff;--accent:#0b7fab;--accent-soft:#e8f4f8}
*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.75}
.top{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}.top-inner{max-width:1120px;margin:auto;padding:13px 16px}h1{margin:0 0 8px;font-size:24px;line-height:1.3}.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill,.link{border:1px solid var(--line);border-radius:999px;background:#fff;padding:3px 10px;color:var(--sub);font-size:13px;text-decoration:none}.link{color:#174154;font-weight:700}
main{max-width:1320px;margin:0 auto;padding:14px 18px 34px;display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px}.side{position:sticky;top:86px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;max-height:calc(100vh - 104px);overflow:auto}.control{display:grid;gap:6px;margin:0 0 11px}.control label,.nav-title{font-size:12px;color:var(--sub);font-weight:700}.nav-title{margin:12px 0 6px}.side input,.side select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px;background:#fff}.side button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;color:var(--ink);font-size:13px}.quick{display:flex;gap:6px;flex-wrap:wrap}.quick button.active{border-color:var(--accent);background:var(--accent-soft);font-weight:700}.summary{margin:10px 0 0;color:var(--sub);font-size:13px}.archive-link{display:flex;align-items:center;gap:7px;width:100%;min-height:34px;margin-bottom:7px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:13px;text-decoration:none}.archive-link span{width:10px;height:10px;border-radius:50%;background:var(--cat);flex:0 0 auto}.archive-link strong{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.archive-link b{margin-left:auto;color:var(--sub);font-size:12px}
.mail-list{display:grid;gap:12px}.mail-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;content-visibility:auto;contain-intrinsic-size:420px}.mail-card header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:#fbfcfe}.mail-card time{display:block;color:var(--sub);font-size:12px}.mail-card h2{margin:2px 0 0;font-size:18px;line-height:1.4}.member{align-self:start;color:var(--accent);font-size:13px;font-weight:800;white-space:nowrap}.body{padding:14px;font-size:15px}.body img.userfile{max-height:1.4em;width:auto;vertical-align:-.25em}.mail-photo{margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:8px;background:#f8fafc}.mail-photo img{display:block;max-width:min(100%,560px);max-height:720px;margin:auto;border-radius:6px}.mail-photo figcaption{margin-top:7px;text-align:center;color:var(--sub);font-size:13px}.empty{padding:28px;background:#fff;border:1px solid var(--line);border-radius:8px;color:var(--sub)}.pager{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center;margin:2px 0 4px}.pager button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;color:var(--ink);font-size:13px}.pager button.active{border-color:var(--accent);background:var(--accent-soft);font-weight:800}.pager button:disabled{opacity:.45}.pager .page-info{color:var(--sub);font-size:13px;padding:0 4px}
@media(max-width:820px){.top{position:static}.top-inner{padding:12px}h1{font-size:21px}main{display:block;padding:0}.side{position:static;max-height:none;border-width:0 0 1px;border-radius:0}.mail-card{border-left:0;border-right:0;border-radius:0}.mail-card header{grid-template-columns:1fr}.member{justify-self:start}.body{padding:12px}.mail-photo img{max-height:560px}}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <h1>ハロモバ メールアーカイブ</h1>
  <div class="meta"><span class="pill">メール 2117件</span><a class="link" href="../../../../index.html">トップ</a><a class="link" href="../hello_pedia/index.html">ハローペディア</a><a class="link" href="../hello_qa/index.html">ハロー！Q&amp;A</a><a class="link" href="../special_events/index.html">特設イベント</a><a class="link" href="../radio/index.html">ハローラジオ</a></div>
</div></header>
<main>
  <aside class="side">
    <div class="nav-title">他のアーカイブ</div>
    <a class="archive-link" style="--cat:#127e97" href="../hello_qa/index.html"><span></span><strong>ハロー！Q&amp;A</strong><b>開く</b></a>
    <a class="archive-link" style="--cat:#127e97" href="../hello_pedia/index.html"><span></span><strong>ハローペディア</strong><b>開く</b></a>
    <a class="archive-link" style="--cat:#4a88c7" href="../hello_pedia/media.html"><span></span><strong>妄想動画</strong><b>開く</b></a>
    <a class="archive-link" style="--cat:#d15f2f" href="../tour_diary/index.html"><span></span><strong>ツアー日記</strong><b>開く</b></a>
    <a class="archive-link" style="--cat:#6b63b5" href="../special_events/index.html"><span></span><strong>特設イベント</strong><b>開く</b></a>
    <a class="archive-link" style="--cat:#2b8a5f" href="../radio/index.html"><span></span><strong>ハローラジオ</strong><b>開く</b></a>
    <div class="nav-title">絞り込み</div>
    <div class="control"><label for="search">検索</label><input id="search" type="search" placeholder="件名・本文で検索"></div>
    <div class="control"><label>年</label><div class="quick" id="years"></div></div>
    <div class="control"><label for="month">月</label><select id="month"></select></div>

  </aside>
  <section class="mail-list"><div class="pager" id="pagerTop"></div><div id="list" class="mail-list"></div><div class="pager" id="pagerBottom"></div></section>
</main>
<script src="mail_data.js"></script>
<script>
const allMessages = window.MAIL_MESSAGES || [];
const state = { year: '', month: '', member: '', query: '', page: 1, perPage: 40 };
const list = document.getElementById('list'), count = document.getElementById('count'), years = document.getElementById('years'), month = document.getElementById('month'), member = document.getElementById('member'), search = document.getElementById('search'), pagerTop = document.getElementById('pagerTop'), pagerBottom = document.getElementById('pagerBottom');
function esc(value){return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function memberName(subject){return String(subject || '').replace(/^\s*From☆\s*/, '').trim() || '不明';}
function ym(date){return String(date || '').slice(0, 7);}
const MEMBER_GROUPS = [
  ['モーニング娘。', ['譜久村聖','生田衣梨奈','石田亜佑美','佐藤優樹','小田さくら','野中美希','牧野真莉愛','羽賀朱音','加賀楓','横山玲奈','森戸知沙希','北川莉央','岡村ほまれ','山﨑愛生','櫻井梨央','井上春華','弓桁朱琴','杉原明紗']],
  ['アンジュルム', ['竹内朱莉','中西香菜','室田瑞希','佐々木莉佳子','上國料萌衣','笠原桃奈','船木結','川村文乃','太田遥香','伊勢鈴蘭','橋迫鈴','川名凜','為永幸音','松本わかな','平山遊季','下井谷幸穂','後藤花']],
  ['Juice=Juice', ['宮本佳林','金澤朋子','高木紗友希','植村あかり','稲場愛香','段原瑠々','井上玲音','工藤由愛','松永里愛','有澤一華','入江里咲','江端妃咲','石山咲良','遠藤彩加里','川嶋美楓']],
  ['つばきファクトリー', ['山岸理子','小片リサ','新沼希空','谷本安美','谷本亜美','岸本ゆめの','浅倉樹々','小野瑞歩','小野田紗栞','秋山眞緒','河西結心','八木栞','福田真琳','豫風瑠乃','石井泉羽','村田結生','土居楓奏']],
  ['BEYOOOOONDS', ['一岡伶奈','高瀬くるみ','清野桃々姫','島倉りか','西田汐里','江口紗耶','前田こころ','山﨑夢羽','岡村美波','平井美葉','小林萌花','里吉うたの','小島はな','大坪茉乃','杉山結菜']],
  ['OCHA NORMA', ['斉藤円香','広本瑠璃','石栗奏美','米村姫良々','窪田七海','田代すみれ','中山夏月姫','西﨑美空','北原もも','筒井澪心']],
  ['ロージークロニクル', ['橋田歩果','吉田姫杷','小野田華凜','村越彩菜','植村葉純','松原ユリヤ','島川波菜','上村麗菜','相馬優芽']],
  ['カントリー・ガールズ', ['山木梨沙','小関舞']],
  ['こぶしファクトリー', ['広瀬彩海','野村みな美','浜浦彩乃','和田桜子']],
  ['ハロプロ研修生', ['林仁愛','西村乙輝','長野桃羽','安田美結']]
];
function memberOptions(values){
  const existing = new Set(values);
  const used = new Set();
  let html = '<option value="">すべて</option>';
  for (const [group, names] of MEMBER_GROUPS) {
    const rows = names.filter(name => existing.has(name));
    if (!rows.length) continue;
    rows.forEach(name => used.add(name));
    html += '<optgroup label="'+esc(group)+'">' + rows.map(name => '<option value="'+esc(name)+'">'+esc(name)+'</option>').join('') + '</optgroup>';
  }
  const others = values.filter(name => !used.has(name)).sort((a,b)=>a.localeCompare(b,'ja'));
  if (others.length) html += '<optgroup label="その他">' + others.map(name => '<option value="'+esc(name)+'">'+esc(name)+'</option>').join('') + '</optgroup>';
  return html;
}
function setup(){
  const yearValues = [...new Set(allMessages.map(m => String(m.date).slice(0,4)).filter(Boolean))].sort().reverse();
  years.innerHTML = '<button type="button" data-year="">すべて</button>' + yearValues.map(y => '<button type="button" data-year="'+esc(y)+'">'+esc(y)+'</button>').join('');
  const members = [...new Set(allMessages.map(m => m.member || memberName(m.subject)))];
  member.innerHTML = '<option value="">すべて</option>' + members.map(v => '<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
  member.innerHTML = memberOptions(members);
  const latestMonth = allMessages[0] ? ym(allMessages[0].date) : '';
  state.year = latestMonth.slice(0,4);
  state.month = latestMonth;
  refreshMonths();
  apply();
}
function refreshMonths(){
  const months = [...new Set(allMessages.filter(m => !state.year || String(m.date).startsWith(state.year)).map(m => ym(m.date)).filter(Boolean))].sort().reverse();
  month.innerHTML = '<option value="">すべて</option>' + months.map(v => '<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
  if (state.month && !months.includes(state.month)) state.month = '';
  month.value = state.month;
  for (const b of years.querySelectorAll('button')) b.classList.toggle('active', b.dataset.year === state.year);
}
function filtered(){
  const q = state.query.toLowerCase();
  return allMessages.filter(m => (!state.year || String(m.date).startsWith(state.year)) && (!state.month || ym(m.date) === state.month) && (!state.member || m.member === state.member) && (!q || String(m.searchText || '').toLowerCase().includes(q)));
}
function renderCard(m){
  return '<article class="mail-card"><header><div><time>'+esc(m.date)+'</time><h2>'+esc(m.subject)+'</h2></div><span class="member">'+esc(m.member)+'</span></header><div class="body">'+m.html+'</div></article>';
}
function renderPager(rows, pageCount){
  if (!rows.length) return '';
  const pages = [];
  const add = p => { if (p >= 1 && p <= pageCount && !pages.includes(p)) pages.push(p); };
  add(1);
  for (let p = state.page - 2; p <= state.page + 2; p += 1) add(p);
  add(pageCount);
  pages.sort((a,b)=>a-b);
  let prev = 0;
  const buttons = [];
  for (const p of pages) {
    if (prev && p - prev > 1) buttons.push('<span class="page-info">...</span>');
    buttons.push('<button type="button" data-page="'+p+'" class="'+(p===state.page?'active':'')+'">'+p+'</button>');
    prev = p;
  }
  return '<button type="button" data-page="'+(state.page-1)+'" '+(state.page<=1?'disabled':'')+'>前へ</button>' +
    buttons.join('') +
    '<button type="button" data-page="'+(state.page+1)+'" '+(state.page>=pageCount?'disabled':'')+'>次へ</button>' +
    '<span class="page-info">'+state.page+' / '+pageCount+'</span>';
}
function apply(){
  state.query = search.value.trim();
  const rows = filtered();
  const pageCount = Math.max(1, Math.ceil(rows.length / state.perPage));
  state.page = Math.min(Math.max(1, state.page), pageCount);
  const start = (state.page - 1) * state.perPage;
  const visible = rows.slice(start, start + state.perPage);
  const pager = renderPager(rows, pageCount);
  pagerTop.innerHTML = pager;
  pagerBottom.innerHTML = pager;
  list.innerHTML = visible.map(renderCard).join('') || '<div class="empty">該当するメールがありません。</div>';
  count.textContent = rows.length + '件中 ' + (rows.length ? (start + 1) : 0) + '-' + Math.min(start + visible.length, rows.length) + '件を表示';
}
function goPage(page){ state.page = Number(page) || 1; apply(); pagerTop.scrollIntoView({block:'start'}); }
for (const pager of [pagerTop, pagerBottom]) pager.addEventListener('click', e => { const b=e.target.closest('button[data-page]'); if(!b || b.disabled)return; goPage(b.dataset.page); });
years.addEventListener('click', e => { const b=e.target.closest('button[data-year]'); if(!b)return; state.year=b.dataset.year; state.month=''; state.page=1; refreshMonths(); apply(); });
month.addEventListener('change', () => { state.month=month.value; state.page=1; apply(); });
member.addEventListener('change', () => { state.member=member.value; state.page=1; apply(); });
search.addEventListener('input', () => { state.page=1; apply(); });
document.getElementById('reset').addEventListener('click', () => { state.year=''; state.month=''; state.member=''; search.value=''; member.value=''; state.page=1; refreshMonths(); apply(); });
setup();
</script>
</body>
</html>
